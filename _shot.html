<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;background:#ff00ff}
  iframe{border:0;display:block;position:absolute;left:0;top:0}
</style></head><body>
<script>
const q = new URLSearchParams(location.search);
const w = +q.get('w') || 390, h = +q.get('h') || 844, y = +q.get('y') || 0;
const f = document.createElement('iframe');
f.width = w; f.height = h;
f.style.width = w + 'px'; f.style.height = h + 'px';
f.src = '/index.html';
document.body.appendChild(f);
f.onload = () => {
  if (y) {
    try {
      f.contentDocument.documentElement.style.scrollBehavior = 'auto';
      f.contentWindow.scrollTo(0, y);
    } catch (e) {}
  }
};
</script>
</body></html>
