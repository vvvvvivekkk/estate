<!doctype html>
<html><head><meta charset="utf-8"></head><body>
<pre id="out">PENDING</pre>
<video id="v" muted playsinline preload="auto" disablepictureinpicture>
  <source src="scrub.mp4" type="video/mp4">
</video>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
const v = document.getElementById('v');
(async () => {
  const log = {};
  let w = 0;
  while (v.readyState < 1 && w < 10000) { await sleep(100); w += 100; }
  log.afterMetadata = { rs: v.readyState, dur: +v.duration.toFixed(2) };

  // give preload time to progress on its own
  for (let i = 0; i < 40 && v.readyState < 2; i++) await sleep(250);
  log.afterPreloadWait = { rs: v.readyState, seek: v.seekable.length ? [+v.seekable.start(0).toFixed(2), +v.seekable.end(0).toFixed(2)] : null,
                           buf: v.buffered.length ? +v.buffered.end(0).toFixed(2) : null };

  // try play() to kick the decoder (this is what primeFrame does)
  let playErr = null;
  try { await v.play(); } catch (e) { playErr = e.name + ': ' + e.message; }
  await sleep(1500);
  log.afterPlay = { err: playErr, rs: v.readyState, paused: v.paused, ct: +v.currentTime.toFixed(2),
                    seek: v.seekable.length ? [+v.seekable.start(0).toFixed(2), +v.seekable.end(0).toFixed(2)] : null };
  v.pause();

  // the real question: does a seek land?
  v.currentTime = 12;
  await sleep(2000);
  log.seekTo12 = { ct: +v.currentTime.toFixed(2), rs: v.readyState, err: v.error ? v.error.code : null };

  v.currentTime = 30;
  await sleep(2000);
  log.seekTo30 = { ct: +v.currentTime.toFixed(2), rs: v.readyState };

  document.getElementById('out').textContent = 'PROBE_JSON:' + JSON.stringify(log);
})();
</script>
</body></html>
